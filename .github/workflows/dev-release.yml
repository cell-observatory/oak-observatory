name: Dev pre-release

# The ROLLING pre-release: every push to the persistent `dev` branch re-stamps the version as
# <base>-dev.<run#>, re-runs the full ubuntu suite + e2e, rebuilds every artifact release.sh builds,
# force-moves the `dev-latest` TAG (a tag name distinct from the branch, so refs never turn
# ambiguous), and refreshes ONE GitHub release marked `prerelease` — which keeps it invisible to
# `releases/latest`, i.e. to every stable-channel install. The pre-release channel
# (`oak update --channel dev`, or the editors' version dropdown) always serves the
# tip of dev. macOS/Windows coverage for dev comes from the PR runs that merged into it; this job
# gates publishing on the ubuntu suite only.
on:
  push:
    branches: [dev]

permissions:
  contents: write

# One rolling release — a second push while a build runs would race the tag + asset uploads.
concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refuse to publish until the GitHub repo is renamed
        # The same gate as release.yml's. This build's updater, installers and JetBrains repository
        # URLs all name cell-observatory/oak-observatory, which 404s until the rename; and the publish
        # below deletes the old name's assets from dev-latest first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NWO="$(gh repo view --json nameWithOwner -q .nameWithOwner)"
          if [ "$NWO" != "cell-observatory/oak-observatory" ]; then
            echo "::error::repository is '$NWO', not cell-observatory/oak-observatory — rename the GitHub repo before pushing to dev; this build's updater, installers and JetBrains repository would 404 otherwise."
            exit 1
          fi
          echo "repository is $NWO — dev build URLs will resolve"
      - name: Stamp the rolling dev version
        # <base>-dev.<run#> across every package + the lockfile + the README badge (version.mjs is
        # the single stamping tool, so `npm test`'s version:check passes on the stamped tree). The
        # base strips any committed prerelease suffix defensively — dev's committed version is the
        # NEXT stable target (e.g. 0.10.0), bumped right after each promote.
        run: |
          BASE="$(node -p "require('./package.json').version")"
          BASE="${BASE%%-*}"
          VER="${BASE}-dev.${{ github.run_number }}"
          node scripts/version.mjs "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "stamped $VER"
      # THE ROLLING CHANNEL MUST ONLY EVER GO FORWARD.
      #
      # `dev`'s committed version is the next stable TARGET, and a promote can silently pull it
      # backwards: `main` carries the release it just cut, and because main contains dev after the
      # promote, `git merge main` into dev is a fast-forward — no conflict, no warning, and dev's
      # 0.10.0 quietly becomes 0.9.3. Nothing downstream notices. `version:check` still passes,
      # because it only proves the files agree with EACH OTHER, and they agree perfectly at the wrong
      # number. The first symptom would be this workflow publishing `0.9.3-dev.N` over a live
      # `0.10.0-dev.M`, which strands every pre-release install above the version line — auto-update
      # compares and finds nothing newer, so it simply goes quiet.
      #
      # Checked against what is actually PUBLISHED rather than against a constant, and with core's own
      # comparator — the one that already knows `0.10.0-dev.4 < 0.10.0` and is unit-tested for it.
      - run: npm ci
      - run: npm test
      - run: bash test/e2e.sh
      - run: npm run release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew buildPlugin --console=plain
        working-directory: packages/jetbrains
      # Placed here, not beside the stamp: it uses core's own comparator, and core has to be BUILT
      # first — the first version of this ran before `npm ci` and died on a missing dist. Late is fine:
      # the only thing it has to beat is the publish below, and it fails CLOSED.
      # It must outrank the newest STABLE release too: dev-channel installs move to that release at a
      # promote, and a `0.10.0-dev.N` below a published 0.10.0 is never offered to them.
      - name: The rolling version must outrank the published pre-release and stable release
        run: |
          node -e '
            const { execSync } = require("child_process");
            const { isNewer } = require("./packages/core/dist/index.js");
            const want = process.env.VER;
            const published = (cmd) => {
              let out = "";
              try { out = execSync(cmd, { encoding: "utf8" }); } catch { /* none published yet */ }
              return (out.match(/\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?/) || [])[0];
            };
            // The rolling pre-release names its version in its title; `gh release view` with no tag is the newest stable.
            for (const [what, version, why] of [
              ["pre-release", published("gh release view dev-latest --json name -q .name"),
                `dev'"'"'s committed version has gone BACKWARDS — almost certainly a promote merged into dev without re-stamping.`],
              ["stable release", published("gh release view --json tagName -q .tagName"),
                `dev was not bumped past the release it promoted.`],
            ]) {
              if (!version) { console.log(`no published ${what} to compare against — allowed`); continue; }
              if (!isNewer(want, version)) {
                console.error(`::error::${want} does not outrank the published ${what} ${version}. ${why} Fix: node scripts/version.mjs <next target>-dev.0 on dev.`);
                process.exit(1);
              }
              console.log(`${want} outranks the published ${what} ${version}`);
            }
          '
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Refresh the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-latest"
          # STABLE asset names: --clobber only replaces same-named files, and the updater's
          # `.find(/\.tgz$/)` must never race a pile of stale versioned tarballs.
          cp release/oak-observatory-*.tgz "release/oak-observatory-cli-dev.tgz"
          cp release/oak-observatory.vsix "release/oak-observatory-vscode-dev.vsix"
          cp packages/jetbrains/build/distributions/*.zip "release/oak-observatory-jetbrains-dev.zip"
          # The pre-release channel's JetBrains repo descriptor. Subscribing an IDE to
          #   https://github.com/cell-observatory/oak-observatory/releases/download/dev-latest/updatePlugins.xml
          # auto-updates the plugin from the rolling build (the stable URL stays releases/latest/…).
          cat > release/updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="com.cell-observatory.oak-observatory" version="${VER}"
                    url="https://github.com/cell-observatory/oak-observatory/releases/download/${TAG}/oak-observatory-jetbrains-dev.zip">
              <name>OAK</name>
              <idea-version since-build="252"/>
            </plugin>
          </plugins>
          XML
          # Move the rolling tag to this commit; the release object follows its tag.
          git tag -f "$TAG"
          git push origin -f "refs/tags/$TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "Pre-release ${VER} (rolling, from dev)" \
              --notes "Rolling build of the \`dev\` branch — refreshed on every push. Install/follow it with \`oak update --channel dev\` or the editors' version dropdown."
          fi
          # Remove the pre-rename assets left on the rolling release from before the OAK rename.
          # --clobber only replaces same-named assets, so the old claude-observatory-* trio would
          # otherwise stay attached forever — and every updater resolves by first suffix match
          # (assetFor / find(/\.tgz$/)), with GitHub returning assets sorted by name, so `claude-*`
          # sorts before `oak-*` and fresh dev installs would pull the stale pre-rename artifact.
          for stale in claude-observatory-cli-dev.tgz claude-observatory-vscode-dev.vsix claude-observatory-jetbrains-dev.zip; do
            gh release delete-asset "$TAG" "$stale" -y 2>/dev/null || true
          done
          gh release upload "$TAG" --clobber \
            release/oak-observatory-cli-dev.tgz \
            release/oak-observatory-vscode-dev.vsix \
            release/oak-observatory-jetbrains-dev.zip \
            release/updatePlugins.xml
          gh release edit "$TAG" --prerelease \
            --title "Pre-release ${VER} (rolling, from dev)" \
            --notes "Rolling build of the \`dev\` branch at ${GITHUB_SHA} — refreshed on every push. Install/follow it with \`oak update --channel dev\` or the editors' version dropdown."
      - name: No pre-rename asset is left on the rolling release
        # The delete above ignores errors (an asset already gone is one). If a delete really failed,
        # `claude-*` sorts before `oak-*`, and every updater would install the stale asset.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT="$(gh release view dev-latest --json assets -q '.assets[].name' | grep '^claude-observatory-' || true)"
          if [ -n "$LEFT" ]; then
            echo "::error::pre-rename assets are still attached to dev-latest, and updaters would pick them: $LEFT — delete them with gh release delete-asset."
            exit 1
          fi
          echo "no pre-rename assets on dev-latest"
