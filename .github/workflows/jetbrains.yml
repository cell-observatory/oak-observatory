name: JetBrains

# Gradle test + buildPlugin so the plugin's build health carries its own README badge and the
# installable zip is downloadable per-commit.
#
# `test` now boots a HEADLESS IDE (see src/test/.../platform/) and asserts the things only a running
# IDE reveals — toolbar target components, action update() contracts, and the guided tour driven step by
# step. Those tests need the `oak` CLI on PATH, so the CLI is built and linked first;
# without it they skip, and a check that silently tests nothing is worse than no check.
#
# `verifyPlugin` is the JetBrains Plugin Verifier against the compile baseline AND a newer IDE. The
# plugin declares no untilBuild, so it loads into IDEs it was never compiled against — an API that
# changed signature is a runtime error the compiler and the tests both pass straight over.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: gradle test + buildPlugin
    # The organization's self-hosted Linux runners (the labels every one of them carries). The job runs in a fresh
    # container: a clean filesystem, PATH and home, as on a GitHub-hosted runner, and nothing of the machine's own
    # accounts. It runs as uid 1000, the runner accounts' own on every runner machine, so what it writes stays theirs
    # to clean up, and the tests run as an ordinary user, as on a hosted runner. The workflows that publish (release,
    # dev-release, pages) stay on GitHub-hosted runners.
    runs-on: [self-hosted, Linux, X64]
    # The dev-container Node image: Debian with git, python3, make and g++ (node-pty compiles from source on Linux), jq
    # in /usr/bin (the status-line tests run with only the system folders on PATH), a C.UTF-8 locale, and user 1000.
    container:
      image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
      # --init: the runner starts the container on `tail -f /dev/null`, which never collects an ended process, so a test
      # that stops a child would see it linger as a zombie; docker's init is process 1 instead and collects them.
      options: --user 1000:1000 --init
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The headless-IDE tests drive the REAL CLI, so put it on PATH.
      - run: npm ci && npm run build && npm link -w oak-observatory
      - run: oak --version
      # The IDEs both steps build and verify against come from JetBrains' CDN on every run, and twice on 2026-11-07 the
      # runner could not reach it for a while: the step failed with "Network is unreachable" before any test ran. Each
      # step runs again after a pause, only when Gradle could not fetch a dependency over the network; a test or build
      # failure ends it at once.
      - name: Test and build the plugin
        shell: bash
        run: |
          for pause in 60 120 -; do
            ./gradlew test buildPlugin --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log" && exit 0
            [ "$pause" != - ] && grep -qE 'Could not (resolve|GET|HEAD|download)' "$RUNNER_TEMP/gradle.log" &&
              grep -qE 'Network is unreachable|Connection (timed out|reset|refused)|UnknownHostException|status code 5[0-9][0-9]' "$RUNNER_TEMP/gradle.log" || exit 1
            echo "::warning::Gradle could not reach a dependency's server; trying again in ${pause}s"; sleep "$pause"
          done
        working-directory: packages/jetbrains
      - name: Plugin Verifier (binary compatibility across IDE versions)
        shell: bash
        run: |
          for pause in 60 120 -; do
            ./gradlew verifyPlugin --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log" && exit 0
            [ "$pause" != - ] && grep -qE 'Could not (resolve|GET|HEAD|download)' "$RUNNER_TEMP/gradle.log" &&
              grep -qE 'Network is unreachable|Connection (timed out|reset|refused)|UnknownHostException|status code 5[0-9][0-9]' "$RUNNER_TEMP/gradle.log" || exit 1
            echo "::warning::Gradle could not reach a dependency's server; trying again in ${pause}s"; sleep "$pause"
          done
        working-directory: packages/jetbrains
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: packages/jetbrains/build/reports/pluginVerifier/**
      - uses: actions/upload-artifact@v7
        with:
          name: oak-observatory-jetbrains
          path: packages/jetbrains/build/distributions/*.zip
