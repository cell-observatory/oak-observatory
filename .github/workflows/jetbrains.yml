name: JetBrains

# Gradle test + buildPlugin so the plugin's build health carries its own README badge and the
# installable zip is downloadable per-commit.
#
# `test` now boots a HEADLESS IDE (see src/test/.../platform/) and asserts the things only a running
# IDE reveals — toolbar target components, action update() contracts, and the guided tour driven step by
# step. Those tests need the `claude-observatory` CLI on PATH, so the CLI is built and linked first;
# without it they skip, and a check that silently tests nothing is worse than no check.
#
# `verifyPlugin` is the JetBrains Plugin Verifier against the compile baseline AND a newer IDE. The
# plugin declares no untilBuild, so it loads into IDEs it was never compiled against — an API that
# changed signature is a runtime error the compiler and the tests both pass straight over.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: gradle test + buildPlugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The headless-IDE tests drive the REAL CLI, so put it on PATH.
      - run: npm ci && npm run build && npm link -w claude-observatory
      - run: claude-observatory --version
      - run: ./gradlew test buildPlugin --console=plain
        working-directory: packages/jetbrains
      - name: Plugin Verifier (binary compatibility across IDE versions)
        run: ./gradlew verifyPlugin --console=plain
        working-directory: packages/jetbrains
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: packages/jetbrains/build/reports/pluginVerifier/**
      - uses: actions/upload-artifact@v7
        with:
          name: claude-observatory-jetbrains
          path: packages/jetbrains/build/distributions/*.zip
