name: Pages

# Publishes the site to GitHub Pages: the stable site from main at the root, and the pre-release site, from the
# commit the newest dev pre-release was built from, under dev/:
#   https://cell-observatory.github.io/oak-observatory/      (stable; redirects to showcase.html)
#   https://cell-observatory.github.io/oak-observatory/dev/  (pre-release, for the dev channel)
# versions.json at the root names both versions, and each page's version label (docs/channel.js) switches between them.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-docs.mjs', 'scripts/build-editor-demo-embed.mjs', 'package.json', '.github/workflows/pages.yml']
  # After each dev pre-release. A workflow_run runs from main, the one branch the github-pages environment deploys.
  workflow_run:
    workflows: ['Dev pre-release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pre-release site: the commit the rolling dev-latest pre-release was built from.
      - uses: actions/checkout@v7
        with:
          ref: dev-latest
          path: .pre
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify generated docs are current
        run: |
          node scripts/build-docs.mjs
          # The Editors page iframes docs/embed-editor-demo.html, which is generated SEPARATELY from
          # docs/showcase.html. Leaving it out of this gate let a homepage demo change publish while
          # the embedded copy stayed on the previous one.
          node scripts/build-editor-demo-embed.mjs
          git diff --exit-code -- docs
      - name: Build the pre-release site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The pre-release's version, from its name ("Pre-release X.Y.Z-dev.N (rolling, from dev)"), stamped into its
          # pages as the dev pre-release stamps its build.
          dev=$(gh release view dev-latest --repo "$GITHUB_REPOSITORY" --json name --jq .name | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+' | head -n 1)
          if [ -z "$dev" ]; then echo "::error::the dev-latest release's name carries no X.Y.Z-dev.N version"; exit 1; fi
          echo "DEV_VERSION=$dev" >> "$GITHUB_ENV"
          cd .pre
          node scripts/version.mjs "$dev"
          node scripts/build-docs.mjs
          node scripts/build-editor-demo-embed.mjs
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R docs/. _site/
          rm -rf _site/dev
          cp -R .pre/docs _site/dev
          # Search engines index the stable site; the pre-release copy is for people on the dev channel.
          for f in _site/dev/*.html; do sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex">#' "$f"; done
          node -e 'const fs = require("fs"); fs.writeFileSync("_site/versions.json", JSON.stringify({ stable: require("./package.json").version, dev: process.env.DEV_VERSION }) + "\n")'
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
