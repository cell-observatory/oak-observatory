name: Pages

# Publishes docs/ to GitHub Pages so the showcase renders in a browser straight from the repo:
#   https://cell-observatory.github.io/oak-observatory/  (redirects to showcase.html)
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-docs.mjs', 'scripts/build-editor-demo-embed.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify generated docs are current
        run: |
          node scripts/build-docs.mjs
          # The Editors page iframes docs/embed-editor-demo.html, which is generated SEPARATELY from
          # docs/showcase.html. Leaving it out of this gate let a homepage demo change publish while
          # the embedded copy stayed on the previous one.
          node scripts/build-editor-demo-embed.mjs
          git diff --exit-code -- docs
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
