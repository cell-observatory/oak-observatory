name: Linux

# Split from the old ci.yml so each platform / artifact carries its own README status badge
# (badges are per-workflow). Nothing here needs a Claude account: unit tests run against temp
# HOMEs with synthetic transcripts, the extension smoke test mocks the vscode API, and the e2e
# harness drives the real bundled CLI + capture hook in an isolated store.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN — these jobs only checkout and upload artifacts.
permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # OAK supports Node 24 and later (core INDEX_NODES). DEP0190 is a runtime warning on 24, so this lane
        # also checks that "the update no longer prints a deprecation warning" (#45); the reporter was on 24.18.
        node: [24]
    # The organization's self-hosted Linux runners (the labels every one of them carries). The job runs in a fresh
    # container: a clean filesystem, PATH and home, as on a GitHub-hosted runner, and nothing of the machine's own
    # accounts. It runs as uid 1000, the runner accounts' own on every runner machine, so what it writes stays theirs
    # to clean up, and the tests run as an ordinary user, as on a hosted runner. The workflows that publish (release,
    # dev-release, pages) stay on GitHub-hosted runners.
    runs-on: [self-hosted, Linux, X64]
    # The dev-container Node image: Debian with git, python3, make and g++ (node-pty compiles from source on Linux), jq
    # in /usr/bin (the status-line tests run with only the system folders on PATH), a C.UTF-8 locale, and user 1000.
    container:
      image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
      # --init: the runner starts the container on `tail -f /dev/null`, which never collects an ended process, so a test
      # that stops a child would see it linger as a zombie; docker's init is process 1 instead and collects them.
      options: --user 1000:1000 --init
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The real-binary herdr tests (its CLI parser, the Codex join over its wire, a sandboxed server)
      # skip without herdr. Install the pinned, checksum-verified build as the installers do: no
      # server, integrations or plugin, since the tests start a sandboxed server where they need one.
      - name: Install the pinned herdr
        run: |
          npm run build:core
          node -e "require('./packages/core/dist/herdr-install').ensureHerdr({ startServer: false, integrations: [], pluginDir: null }).then((r) => console.log('herdr', r.version, 'at', r.bin))"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # builds core + cli + the extension bundle, then runs core unit tests + the extension smoke test.
      # Output is teed to a file and uploaded on failure, so failures are diagnosable from the artifact.
      - run: npm test 2>&1 | tee test-output.txt
        shell: bash
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-linux-node${{ matrix.node }}
          path: test-output.txt
      # end-to-end: real CLI + capture hook over an isolated temp HOME/workspace (dist already built).
      - run: bash test/e2e.sh
