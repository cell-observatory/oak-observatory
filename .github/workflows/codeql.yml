name: CodeQL

# Advanced-setup code scanning, pinned to the languages that carry the security surface:
# the TypeScript core/CLI/extension and the Actions workflows. Java/Kotlin is deliberately
# NOT scanned — the JetBrains plugin is a thin UI front-end with its own unit tests, and the
# CodeQL Kotlin extractor doesn't support the Kotlin 2.4 toolchain this project uses.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '30 5 * * 1' # weekly sweep so new queries run even without pushes

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The organization's self-hosted Linux runners (the labels every one of them carries), in a fresh container whose
    # Node the TypeScript extractor needs, as uid 1000, the runner accounts' own.
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
      options: --user 1000:1000
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
