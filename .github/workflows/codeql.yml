name: CodeQL

# Advanced-setup code scanning, pinned to the languages that carry the security surface:
# the TypeScript core/CLI/extension and the Actions workflows. Java/Kotlin is deliberately
# NOT scanned — the JetBrains plugin is a thin UI front-end with its own unit tests, and the
# CodeQL Kotlin extractor doesn't support the Kotlin 2.2 toolchain this project uses.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '30 5 * * 1' # weekly sweep so new queries run even without pushes

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
