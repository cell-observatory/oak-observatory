name: VS Code

# Builds the release artifacts (the CLI .tgz + the VS Code .vsix — no publish, no account) so the
# extension's build health carries its own README badge and the bundle is downloadable per-commit.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: build .vsix + CLI .tgz
    # The organization's self-hosted Linux runners (the labels every one of them carries). The job runs in a fresh
    # container: a clean filesystem, PATH and home, as on a GitHub-hosted runner, and nothing of the machine's own
    # accounts. It runs as uid 1000, the runner accounts' own on every runner machine, so what it writes stays theirs
    # to clean up, and the tests run as an ordinary user, as on a hosted runner. The workflows that publish (release,
    # dev-release, pages) stay on GitHub-hosted runners.
    runs-on: [self-hosted, Linux, X64]
    # The dev-container Node image: Debian with git, python3, make and g++ (node-pty compiles from source on Linux), jq
    # in /usr/bin (the status-line tests run with only the system folders on PATH), a C.UTF-8 locale, and user 1000.
    container:
      image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
      # --init: the runner starts the container on `tail -f /dev/null`, which never collects an ended process, so a test
      # that stops a child would see it linger as a zombie; docker's init is process 1 instead and collects them.
      options: --user 1000:1000 --init
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run release` also builds the JetBrains plugin, through the committed wrapper. The wrapper
      # fetches the Gradle distribution itself with NO cache and exactly one attempt ("Attempt 1/1"),
      # so any blip on services.gradle.org reds this job on a commit that is perfectly fine — which is
      # what a 503 did here. setup-gradle caches the distribution and the Gradle user home, which is
      # why jetbrains.yml (which already uses it) sailed through the same outage on the same commit.
      # Nothing else about the build changes: release.sh still drives ./gradlew. A self-hosted runner has no
      # default JDK to rely on, so this sets up the one the plugin's toolchain asks for, as jetbrains.yml does.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm run release
      - uses: actions/upload-artifact@v7
        with:
          name: oak-observatory-release
          path: release/*
