name: Release

# Cut a release by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
# CI re-runs the full suite, builds the share artifacts, and attaches them to a GitHub Release —
# teammates install with `npm i -g --allow-scripts=node-pty ./oak-observatory-<ver>.tgz` and
# `code --install-extension *.vsix`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm publish --provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the tag matches the committed version
        # The generated updatePlugins.xml (+ the vsix/zip filenames) derive their version from the tag,
        # while the built plugin's internal version comes from the committed source. If they disagree,
        # the descriptor advertises a version the zip doesn't contain and IDEs re-offer it on every poll
        # (an update that never sticks). Fail fast before the ~minutes of build. `npm test` below runs
        # version:check, which locksteps build.gradle.kts + every package.json + the lockfile to root
        # package.json — so gating the tag on root package.json transitively covers them all.
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          # X.Y.Z-dev.0 is the version every `dev` checkout carries, and OAK reads it as a local build (isLocalBuild):
          # a release at it is never offered an update, so every install of it would stay there.
          case "$VER" in *-dev.0) echo "::error::tag $TAG names a local build's version (-dev.0), which no release carries — stamp the release version first (node scripts/version.mjs X.Y.Z) and tag that"; exit 1 ;; esac
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG_VER" ]; then
            echo "::error::tag $TAG (=$VER) != committed version $PKG_VER — bump versions (npm run version:set) or fix the tag"
            exit 1
          fi
          echo "tag $TAG matches committed version $PKG_VER"
      - name: Refuse to release until the GitHub repo is renamed
        # Every updater/installer/doc URL targets cell-observatory/oak-observatory — `oak update`, the
        # VS Code notifier's RELEASE_REPO, JB_PLUGIN_REPO_URL, the generated updatePlugins.xml URL, both
        # install one-liners, and the README badges. If this repository still carries the OLD name at
        # release time, all of those 404 and every 0.10.0 install ships un-updatable. Rename the GitHub
        # repository to `oak-observatory` BEFORE pushing the tag; this gate makes a premature release
        # impossible (fail fast, before the minutes of build below).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NWO="$(gh repo view --json nameWithOwner -q .nameWithOwner)"
          if [ "$NWO" != "cell-observatory/oak-observatory" ]; then
            echo "::error::repository is '$NWO', not cell-observatory/oak-observatory — rename the GitHub repo before tagging; the updater, installers, and docs all point at the new name and would 404 otherwise."
            exit 1
          fi
          echo "repository is $NWO — release URLs will resolve"
      - run: npm ci
      - run: npm test
      - run: bash test/e2e.sh
      # release.sh builds the JetBrains plugin when JAVA_HOME has a JDK, so the JDK and Gradle's cache come
      # first: after it, the wrapper downloaded Gradle uncached, with no retry, on the runner's default JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm run release
      - run: ./gradlew buildPlugin --console=plain
        working-directory: packages/jetbrains
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cp release/oak-observatory.vsix "release/oak-observatory-vscode-${TAG}.vsix"
          cp packages/jetbrains/build/distributions/*.zip "release/oak-observatory-jetbrains-${TAG}.zip"
          # JetBrains self-hosted plugin repository descriptor. IDEs subscribed to the stable URL
          #   https://github.com/cell-observatory/oak-observatory/releases/latest/download/updatePlugins.xml
          # poll it for updates. It MUST be regenerated + attached every release — once this tag becomes
          # "latest", that URL serves this file, so a release without it 404s and auto-update goes silent.
          cat > release/updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="com.cell-observatory.oak-observatory" version="${VER}"
                    url="https://github.com/cell-observatory/oak-observatory/releases/download/${TAG}/oak-observatory-jetbrains-${TAG}.zip">
              <name>OAK</name>
              <idea-version since-build="252"/>
            </plugin>
          </plugins>
          XML
          # Release notes come from the hand-curated CHANGELOG section for this version — the
          # migration and upgrade callouts live there, and old installs link users to this page.
          # A tag with no section still releases, loudly, on generated notes.
          awk -v ver="$VER" '$0 ~ "^## \\[" ver "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > release/notes.md
          # GitHub refuses a release whose notes pass 125,000 characters ("body is too long"), and this step then
          # creates no release, so the tag stands with no assets. Longer notes end before the first entry or heading
          # that does not fit (counted in bytes, which are never fewer than characters), and say where the rest is.
          if [ "$(wc -c < release/notes.md)" -gt 120000 ]; then
            LC_ALL=C awk -v max=120000 '{ line[NR] = $0; size += length($0) + 1; if (/^(- |#+ )/) head[NR] = 1; if (size <= max) fit = NR }
              END { for (cut = fit + 1; cut > 1 && !head[cut]; cut--); for (i = 1; i < cut; i++) print line[i] }' release/notes.md > release/notes.cut
            printf "\nGitHub keeps a release's notes to 125,000 characters: the rest of these notes are in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n" \
              "$GITHUB_REPOSITORY" "$TAG" >> release/notes.cut
            mv release/notes.cut release/notes.md
          fi
          if [ -s release/notes.md ]; then NOTES=(--notes-file release/notes.md); else
            echo "::warning::no CHANGELOG section for ${VER} — falling back to generated notes"
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" \
            release/oak-observatory-*.tgz \
            "release/oak-observatory-vscode-${TAG}.vsix" \
            "release/oak-observatory-jetbrains-${TAG}.zip" \
            release/updatePlugins.xml \
            --title "OAK ${TAG}" \
            "${NOTES[@]}"
      - name: Publish CLI to npm (provenance)
        # Runs only if an NPM_TOKEN is configured; `npm test` above (version:check + lockfile) already
        # gated this. A missing token skips the publish but ANNOTATES the run, so a skipped publish is
        # never silent.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN not set — skipped the npm publish; the npm registry will not serve ${GITHUB_REF_NAME}."
            exit 0
          fi
          ( cd packages/cli && npm publish --provenance --access public )
