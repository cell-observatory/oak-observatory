name: Release

# Cut a release by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
# CI re-runs the full suite, builds the share artifacts, and attaches them to a GitHub Release —
# teammates install with `npm i -g ./claude-observatory-<ver>.tgz` and `code --install-extension *.vsix`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm publish --provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the tag matches the committed version
        # The generated updatePlugins.xml (+ the vsix/zip filenames) derive their version from the tag,
        # while the built plugin's internal version comes from the committed source. If they disagree,
        # the descriptor advertises a version the zip doesn't contain and IDEs re-offer it on every poll
        # (an update that never sticks). Fail fast before the ~minutes of build. `npm test` below runs
        # version:check, which locksteps build.gradle.kts + every package.json + the lockfile to root
        # package.json — so gating the tag on root package.json transitively covers them all.
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG_VER" ]; then
            echo "::error::tag $TAG (=$VER) != committed version $PKG_VER — bump versions (npm run version:set) or fix the tag"
            exit 1
          fi
          echo "tag $TAG matches committed version $PKG_VER"
      - run: npm ci
      - run: npm test
      - run: bash test/e2e.sh
      - run: npm run release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew buildPlugin --console=plain
        working-directory: packages/jetbrains
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cp release/claude-observatory.vsix "release/claude-observatory-vscode-${TAG}.vsix"
          cp packages/jetbrains/build/distributions/*.zip "release/claude-observatory-jetbrains-${TAG}.zip"
          # JetBrains self-hosted plugin repository descriptor. IDEs subscribed to the stable URL
          #   https://github.com/cell-observatory/claude-observatory/releases/latest/download/updatePlugins.xml
          # poll it for updates. It MUST be regenerated + attached every release — once this tag becomes
          # "latest", that URL serves this file, so a release without it 404s and auto-update goes silent.
          cat > release/updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="com.cell-observatory.claude-observatory" version="${VER}"
                    url="https://github.com/cell-observatory/claude-observatory/releases/download/${TAG}/claude-observatory-jetbrains-${TAG}.zip">
              <name>Claude Observatory</name>
              <idea-version since-build="252"/>
            </plugin>
          </plugins>
          XML
          gh release create "$TAG" \
            release/claude-observatory-*.tgz \
            "release/claude-observatory-vscode-${TAG}.vsix" \
            "release/claude-observatory-jetbrains-${TAG}.zip" \
            release/updatePlugins.xml \
            --title "Claude Observatory ${TAG}" \
            --generate-notes
      - name: Publish CLI to npm (provenance)
        # Runs only if an NPM_TOKEN is configured; `npm test` above (version:check + lockfile) already
        # gated this. Skips gracefully otherwise so the GitHub Release still succeeds.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish (GitHub Release still created)."
            exit 0
          fi
          ( cd packages/cli && npm publish --provenance --access public )
